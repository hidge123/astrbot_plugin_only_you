<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>OnlyYou · 控制台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app-shell">
    <!-- ================= 48px 顶栏：品牌 + 角色切换 + 刷新 / 主题 ================= -->
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>OnlyYou</span>
      </div>
      <div class="topbar-divider" aria-hidden="true"></div>
      <div class="topbar-center">
        <div class="soul-picker">
          <span class="soul-picker-label">当前角色</span>
          <span class="select-inline">
            <select id="soul-select" aria-label="当前管理角色"></select>
          </span>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-refresh" type="button" data-tip="刷新数据" aria-label="刷新数据"></button>
        <button class="icon-btn" id="btn-theme" type="button" data-tip="切换明暗主题" aria-label="切换明暗主题"></button>
      </div>
    </header>

    <div class="app-body">
      <!-- ================= 216px 侧栏：由 app.js 从 OY_PAGES 生成 ================= -->
      <aside class="sidebar">
        <nav class="sidebar-nav" id="sidebar-nav" aria-label="主导航"></nav>
      </aside>

      <!-- ================= 主工作区：按 hash 路由渲染 ================= -->
      <main class="main">
        <div id="view" role="main">
          <div class="loading">
            <span class="spinner" aria-hidden="true"></span>
            <span>正在连接 OnlyYou…</span>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- 通用浮层容器 -->
  <div class="toast-container" id="toast-container" aria-live="polite" aria-atomic="false"></div>
  <div class="overlay-root modal-root" id="modal-root"></div>
  <div class="overlay-root drawer-root" id="drawer-root"></div>

  <noscript>
    <div style="padding: 24px; font-family: sans-serif">OnlyYou 控制台需要启用 JavaScript。</div>
  </noscript>

  <!-- AstrBot Plugin Page Bridge SDK（由 AstrBot PluginPageService 注入 / 重写） -->
  <script src="/api/plugin/page/bridge-sdk.js"></script>

  <!-- 无构建 classic script：顺序固定，app.js 必须在所有 page-*.js 之前 -->
  <script src="icons.js"></script>
  <script src="charts.js"></script>
  <script src="app.js"></script>
  <script src="page-overview.js"></script>
  <script src="page-schedule.js"></script>
  <script src="page-character.js"></script>
  <script src="page-relations.js"></script>
  <script src="page-memory.js"></script>
  <script src="page-surfing.js"></script>
  <script src="page-models.js"></script>
  <script src="page-sessions.js"></script>
  <!-- `?mock=1` 或 file:// 直接打开时安装本地 Mock bridge（无 bridge 后台时用于离线预览/截图） -->
  <script src="mock.js"></script>
</body>
</html>
