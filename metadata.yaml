name: astrbot_plugin_only_you
desc: OnlyYou (只有你) —— 具备生命节律、三级记忆与赛博冲浪能力的高自治 AI 伴侣与数字网友插件
help: |
  OnlyYou (只有你) 插件核心指令：
  /onlyyou status - 查看当前角色卡、今日 Roguelite 日程、当前三态与微调配额
  /onlyyou state <RESTING|BUSY|IDLE> [标题] - 手动强制切换当前时段状态（调试/控制）
  /onlyyou reroll - 重新抽取今日 Roguelite 日程与奇遇谈资卡
  /onlyyou memory [list|gc|add] - 查看记忆列表、手动触发定时遗忘清理(GC)或添加测试记忆
  /onlyyou tier <user_id> <1|2|3> - 查看或设置用户的三级关系等级 (L1/L2/L3)
  /onlyyou surf - 手动触发一次 B站/抖音赛博冲浪看片与分享测试
version: 0.1.0
author: hidge123
repo: https://github.com/hidge123/astrbot_plugin_only_you
